
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-os"
version = "0.1.0"
description = "Aura autonomous AI orchestration system"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "langgraph>=0.2.0",
    "pydantic>=2.8.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aura*", "core*", "agents*"]
exclude = ["tests*", "apps*", "evals*", "infra*", "memory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
